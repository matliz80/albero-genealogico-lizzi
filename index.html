  /* ============ CSV ============ */
  function parseCSV(text){
    const rows = []; let row = [], field = '', inQuotes = false;
    for(let i=0;i<text.length;i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field=''; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
        else if(c === '\r'){ }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ''));
  }
  function normalize(s){
    return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  }
  function classifyHeader(h){
    const n = normalize(h);
    if(n.includes('padre')) return 'idPadre';
    if(n.includes('madre')) return 'idMadre';
    if(n.includes('coniuge') || n.includes('sposo') || n.includes('sposa')) return 'coniuge';
    if(n.includes('cognome')) return 'cognome';
    if(n.includes('nome')) return 'nome';
    if(n.includes('sesso') || n.includes('genere')) return 'sesso';
    if(n.includes('nascita') && n.includes('luogo')) return 'luogoNascita';
    if(n.includes('nascita')) return 'dataNascita';
    if(n.includes('morte') && n.includes('luogo')) return 'luogoMorte';
    if(n.includes('morte') || n.includes('decesso')) return 'dataMorte';
    if(n.includes('nota') || n.includes('annotazion')) return 'note';
    if(n.includes('foto') || n.includes('immagine')) return 'foto';
    if(n.includes('id')) return 'id';
    return null;
  }
  function rowsToPersons(rows){
    if(!rows.length) return [];
    const headers = rows[0].map(classifyHeader);

    for(let i=1;i<rows.length;i++){

      if(!r.some(v => (v||'').trim() !== '')) continue;
      const p = {};
      headers.forEach((f, idx) => { if(f) p[f] = (r[idx] || '').trim(); });
      if(!p.id) p.id = '_row' + i;
      if(!p.nome && !p.cognome) continue;
      persons.push(p);

    return persons;
  }

    if(!focusId || !personsById.has(focusId)) return null;
    const visible = new Set([focusId]);
    (function up(id){
      const p = personsById.get(id); if(!p) return;
      [p.idPadre, p.idMadre].forEach(pid => { if(pid && personsById.has(pid) && !visible.has(pid)){ visible.add(pid); up(pid); } });
    })(focusId);
    const kids = id => ALL_PERSONS.filter(p => p.idPadre === id || p.idMadre === id);
    (function down(id){ kids(id).forEach(c => { if(!visible.has(c.id)){ visible.add(c.id); down(c.id); } }); })(focusId);
    return visible;
  }


  /* --- grafica della casella, ricalcata sul modello "blocco" --- */
  // separa dalle annotazioni le date del coniuge, che vanno su una riga propria
  function splitNote(note){
    let s = (note || '').toString(), n = '', d = '';
    const mn = s.match(/\bn\.\s*([0-9][0-9.\/\- ]*)/);
    if(mn){ n = mn[1].trim().replace(/[.\s]+$/,''); s = s.replace(mn[0], ' '); }
    const md = s.match(/[+‡]\s*([0-9][0-9.\/\- ]*)/);
    if(md){ d = md[1].trim().replace(/[.\s]+$/,''); s = s.replace(md[0], ' '); }
    s = s.replace(/[+‡]\s*\.{2,}/g, ' ').replace(/\s*\.{3,}\s*/g, ' ').replace(/\s+/g,' ').trim();
    return { text:s, n:n, d:d };
  }

  // date sempre nel formato gg.mm.aaaa (giorno e mese a due cifre, anno a quattro)
  function fmtDate(v){
    let t = (v == null ? '' : v).toString();
    t = t.replace(/\b(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})\b/g,
      (m,d,mo,y) => (d.length<2?'0':'')+d + '.' + (mo.length<2?'0':'')+mo + '.' + y);
    t = t.replace(/^\s*(\d{1,2})\.(\d{4})\s*$/,
      (m,mo,y) => (mo.length<2?'0':'')+mo + '.' + y);
    return t;
  }
  function drawCard(g, p, W, H){
    const s = W / 177.45;              // scala della cornice originale
    const px = v => +(v*s).toFixed(2);
    g.appendChild(sel('rect', { class:'card-bg', x:0, y:0, width:W, height:H }));

    // gruppo ornamento superiore (poi ribaltato per quello inferiore)
    const orn = () => {
      const q = sel('g', null, 'card-orn');
      q.appendChild(sel('path', { class:'card-frame', 'stroke-width':px(2),
        d:`M${px(-9.61)} ${px(-9.39)}L${px(-4.14)} ${px(-4.86)}`
         +`C${px(-3.07)} ${px(-3.97)} ${px(-1.72)} ${px(-3.48)} ${px(-0.32)} ${px(-3.48)}`
         +`L${px(177.77)} ${px(-3.48)}`
         +`C${px(179.17)} ${px(-3.48)} ${px(180.55)} ${px(-3.97)} ${px(181.62)} ${px(-4.86)}`
         +`L${px(187.09)} ${px(-9.39)}` }));
      q.appendChild(sel('path', { class:'card-frame', 'stroke-width':px(2),
        d:`M${px(11.2)} ${px(-3.48)}C${px(0.25)} ${px(-3.48)} 0 ${px(-6.44)} 0 ${px(-12.17)}` }));
      q.appendChild(sel('path', { class:'card-frame', 'stroke-width':px(2),
        d:`M${px(166.25)} ${px(-3.48)}C${px(177.2)} ${px(-3.48)} ${px(177.45)} ${px(-6.44)} ${px(177.45)} ${px(-12.17)}` }));
      q.appendChild(sel('path', { class:'card-frame', 'stroke-width':px(2),
        d:`M${px(1.2)} ${px(-3.48)}C${px(-1.99)} ${px(-3.48)} ${px(-7.5)} ${px(-1.53)} ${px(-7.5)} ${px(5.21)}` }));
      q.appendChild(sel('path', { class:'card-frame', 'stroke-width':px(2),
        d:`M${px(176.25)} ${px(-3.48)}C${px(179.44)} ${px(-3.48)} ${px(184.95)} ${px(-1.53)} ${px(184.95)} ${px(5.21)}` }));
      q.appendChild(sel('line', { class:'card-frame', 'stroke-width':px(.25), x1:px(13.75), y1:px(-6.5), x2:px(163.75), y2:px(-6.5) }));
      q.appendChild(sel('line', { class:'card-frame', 'stroke-width':px(.25), x1:px(43.75), y1:px(-8.9), x2:px(133.75), y2:px(-8.9) }));
      q.appendChild(sel('circle', { class:'card-dot', 'stroke-width':px(.9), cx:0, cy:px(3.01), r:px(2.17) }));
      q.appendChild(sel('circle', { class:'card-dot', 'stroke-width':px(.9), cx:px(177.45), cy:px(3.01), r:px(2.17) }));
      return q;
    };
    g.appendChild(orn());
    const bot = orn(); bot.setAttribute('transform', `translate(0,${H}) scale(1,-1)`); g.appendChild(bot);

    // montanti verticali
    g.appendChild(sel('line', { class:'card-frame', 'stroke-width':px(.9), x1:0, y1:px(5), x2:0, y2:H-px(5) }));
    g.appendChild(sel('line', { class:'card-frame', 'stroke-width':px(.9), x1:W, y1:px(5), x2:W, y2:H-px(5) }));
    g.appendChild(sel('line', { class:'card-frame', 'stroke-width':px(.25), x1:px(-2.45), y1:px(10), x2:px(-2.45), y2:H-px(10) }));
    g.appendChild(sel('line', { class:'card-frame', 'stroke-width':px(.25), x1:W+px(2.45), y1:px(10), x2:W+px(2.45), y2:H-px(10) }));

    // testo
    const padX = px(4.05);
    const label = personLabel(p);
    let nameLines = wrap(label, 20, 1);
    let fs = 28, step = 30;
    if(label.length > 20){ nameLines = wrap(label, 26, 2); fs = 22; step = 24; }
    let y = fs + 8;
    nameLines.forEach((ln, i) => {
      const t = sel('text', { x:W/2, y:y + i*step, class:'name', 'font-size':fs });
      t.textContent = ln; g.appendChild(t);
    });
    y += (nameLines.length-1)*step + 12;
    g.appendChild(sel('line', { class:'card-rule', 'stroke-width':px(.75), x1:padX, y1:y, x2:W-padX, y2:y }));
    y += 25;
    if(p.dataNascita){
      const t = sel('text', { x:padX, y:y, class:'date birth', 'font-size':18 });
      t.textContent = 'n. ' + fmtDate(p.dataNascita); g.appendChild(t);
    }
    if(p.dataMorte){
      const t = sel('text', { x:W-padX, y:y, class:'date death', 'font-size':18 });
      t.textContent = '‡ ' + fmtDate(p.dataMorte); g.appendChild(t);
    }
    y += 11;
    g.appendChild(sel('line', { class:'card-rule', 'stroke-width':px(.25), x1:padX, y1:y, x2:W-padX, y2:y }));

    const nt = splitNote(p.note);
    const hasSpouseDates = !!(nt.n || nt.d);
    const noteTop = y + 24;
    const limit = (hasSpouseDates ? H - 46 : H - 14);
    const maxLines = Math.max(0, Math.floor((limit - noteTop)/22) + 1);
    const noteLines = wrap(fmtDate(nt.text), 36, maxLines);
    noteLines.forEach((ln, i) => {
      const t = sel('text', { x:padX, y: noteTop + i*22, class:'note-text', 'font-size':15 });
      t.textContent = ln; g.appendChild(t);
    });
    if(hasSpouseDates){
      const spouseY = Math.min(H - 16, noteTop + noteLines.length*22 + 4);
      if(nt.n){ const t = sel('text', { x:padX, y:spouseY, class:'date birth', 'font-size':16 }); t.textContent = 'n. ' + fmtDate(nt.n); g.appendChild(t); }
      if(nt.d){ const t = sel('text', { x:W-padX, y:spouseY, class:'date death', 'font-size':16 }); t.textContent = '‡ ' + fmtDate(nt.d); g.appendChild(t); }
    }
  }

  function render(resetZoom){
    layout = buildLayout(ALL_PERSONS);
    svg.innerHTML = '';
    if(!layout) return;
    svg.setAttribute('viewBox', `0 0 ${layout.width} ${layout.height}`);
    const visible = getVisibleSet();

    // 1. linee esatte del disegno originale (un solo path)
    let d = '';
    for(const l of GEO.lines) d += `M${l[0]} ${l[1]}L${l[2]} ${l[3]}`;
    svg.appendChild(sel('path', { d:d }, 'link' + (visible ? ' faded' : '')));

    // 2. collegamenti calcolati per le persone aggiunte a mano (senza geometria)
    if(layout.extra.length){
      let d2 = '';
      layout.extra.forEach(p => {
        const c = layout.positions.get(p.id);
        [p.idPadre, p.idMadre].forEach(pid => {
          const pp = pid && layout.positions.get(pid);
          if(!pp) return;
          const mid = (pp.y + pp.h + c.y) / 2;
          d2 += `M${pp.x+pp.w/2} ${pp.y+pp.h}L${pp.x+pp.w/2} ${mid}L${c.x+c.w/2} ${mid}L${c.x+c.w/2} ${c.y}`;
        });
      });
      if(d2) svg.appendChild(sel('path', { d:d2 }, 'link'));
    }

    // 3. caselle (grafica "blocco" con cornice ornata)
    ALL_PERSONS.forEach(p => {
      const pos = layout.positions.get(p.id);
      if(!pos) return;
      const isDim = visible && !visible.has(p.id);
      const g = sel('g', { transform:`translate(${pos.x},${pos.y})` },
        'node-card ' + sexClass(p) + (isDim ? ' dim' : '') + (p.id === focusId ? ' focused' : ''));
      g.dataset.id = p.id;
      drawCard(g, p, pos.w, pos.h);
      g.addEventListener('click', () => openDetail(p.id));
      svg.appendChild(g);
    });

    updateFocusUI();
    fitZoom = Math.max(0.02, (vp.clientWidth - 24) / layout.width);
    if(resetZoom) zoom = fitZoom;
    applyZoom();
    applySearchFilter();
  }

  function applyZoom(){
    if(!layout) return;
    svg.style.width  = (layout.width  * zoom) + 'px';
    svg.style.height = (layout.height * zoom) + 'px';
    el('btn-zoom-level').textContent = Math.round(zoom*100) + '%';
  }
  function zoomAt(newZoom, cxPx, cyPx){
    newZoom = Math.max(fitZoom*0.9, Math.min(6, newZoom));
    const contentX = (vp.scrollLeft + cxPx) / zoom;
    const contentY = (vp.scrollTop  + cyPx) / zoom;
    zoom = newZoom; applyZoom();
    vp.scrollLeft = contentX * zoom - cxPx;
    vp.scrollTop  = contentY * zoom - cyPx;
  }
  function zoomCenter(z){ zoomAt(z, vp.clientWidth/2, vp.clientHeight/2); }

  /* ============ RICERCA ============ */
  function applySearchFilter(){
    const q = normalize(el('search').value);
    const cards = svg.querySelectorAll('.node-card');
    if(!q){ cards.forEach(c => c.classList.remove('match')); return; }
    let first = null;
    cards.forEach(c => {
      const p = personsById.get(c.dataset.id);
      const isMatch = normalize(personLabel(p)).includes(q);
      c.classList.toggle('match', isMatch);
      if(isMatch && !first) first = c;
    });
    if(first){
      const pos = layout.positions.get(first.dataset.id);
      if(pos){
        if(zoom < 0.45) { zoom = 0.6; applyZoom(); }
        vp.scrollLeft = (pos.x + pos.w/2)*zoom - vp.clientWidth/2;
        vp.scrollTop  = (pos.y + pos.h/2)*zoom - vp.clientHeight/2;
      }
    }
  }
  el('search').addEventListener('input', applySearchFilter);

  /* ============ DETTAGLIO ============ */
  const FIELD_LABELS = { dataNascita:'Nato/a il', luogoNascita:'Luogo di nascita', dataMorte:'Deceduto/a il', luogoMorte:'Luogo di decesso', coniuge:'Coniuge', note:'Annotazioni' };
  function openDetail(id){
    const p = personsById.get(id); if(!p) return;
    el('detail-id').textContent = 'ID ' + p.id;
    el('detail-name').textContent = personLabel(p);
    const rows = el('detail-rows'); rows.innerHTML = '';
    Object.keys(FIELD_LABELS).forEach(k => {
      if(p[k]){
        const row = document.createElement('div'); row.className = 'detail-row';
        row.innerHTML = `<span class="k">${FIELD_LABELS[k]}</span><span class="v"></span>`;
        row.querySelector('.v').textContent = fmtDate(p[k]);
        rows.appendChild(row);
      }
    });
    const padre = p.idPadre && personsById.get(p.idPadre);
    if(padre){
      const row = document.createElement('div'); row.className = 'detail-row';
      row.innerHTML = `<span class="k">Figlio/a di</span><span class="v"></span>`;
      row.querySelector('.v').textContent = personLabel(padre);
      rows.appendChild(row);
    }
    el('detail-panel').classList.add('open');
    el('overlay').classList.add('open');
    el('detail-focus').onclick = () => { focusId = id; render(); closeDetail(); };
    el('detail-export').onclick = () => { focusId = id; render(); closeDetail(); setTimeout(()=>window.print(), 250); };
  }
  function closeDetail(){ el('detail-panel').classList.remove('open'); el('overlay').classList.remove('open'); }
  el('detail-close').addEventListener('click', closeDetail);
  el('overlay').addEventListener('click', closeDetail);

  /* ============ CONTROLLI ============ */
  function updateFocusUI(){ el('toolbar').classList.toggle('focus-mode', !!focusId); }
  el('btn-reset-view').addEventListener('click', () => { focusId = null; el('search').value=''; render(true); });
  el('btn-fit').addEventListener('click', () => { zoom = fitZoom; applyZoom(); vp.scrollLeft = 0; vp.scrollTop = 0; });
  el('btn-zoom-in').addEventListener('click', () => zoomCenter(zoom * 1.3));
  el('btn-zoom-out').addEventListener('click', () => zoomCenter(zoom / 1.3));
  el('btn-zoom-level').addEventListener('click', () => zoomCenter(1));
  el('btn-export').addEventListener('click', () => window.print());

  // pan col mouse
  let dragging = false, sx, sy, sl, st;
  vp.addEventListener('mousedown', e => {
    if(e.target.closest('.node-card')) return;
    dragging = true; vp.classList.add('dragging');
    sx = e.clientX; sy = e.clientY; sl = vp.scrollLeft; st = vp.scrollTop;
  });
  window.addEventListener('mousemove', e => {
    if(!dragging) return;
    vp.scrollLeft = sl - (e.clientX - sx);
    vp.scrollTop  = st - (e.clientY - sy);
  });
  window.addEventListener('mouseup', () => { dragging = false; vp.classList.remove('dragging'); });

  // rotellina / trackpad: ctrl+wheel = zoom
  vp.addEventListener('wheel', e => {
    if(!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    zoomAt(zoom * (e.deltaY < 0 ? 1.12 : 1/1.12), e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });

  /* ============ SCHERMO INTERO ============ */
  function toggleFullscreen(){
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if(!isFs){
      const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
      if(req) req.call(stage);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document);
    }
  }
  el('btn-fullscreen-float').addEventListener('click', toggleFullscreen);
  function updateFs(){
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    el('btn-fullscreen-float').textContent = isFs ? '⤓' : '⛶';
    el('btn-fullscreen-float').title = isFs ? 'Esci da schermo intero' : 'Schermo intero';
    setTimeout(() => { fitZoom = Math.max(0.02, (vp.clientWidth - 24) / (layout ? layout.width : 1)); }, 120);
  }
  document.addEventListener('fullscreenchange', updateFs);
  document.addEventListener('webkitfullscreenchange', updateFs);

  /* ============ TOUCH: pan a un dito, pinch-zoom a due dita ============ */
  let mode = null, tsx, tsy, tsl, tst, pd0 = 0, pz0 = 1, pcx = 0, pcy = 0;
  const dist = (a,b) => Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
  vp.addEventListener('touchstart', e => {
    if(e.touches.length === 1){
      mode = 'pan';
      tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
      tsl = vp.scrollLeft; tst = vp.scrollTop;
    } else if(e.touches.length === 2){
      mode = 'pinch';
      pd0 = dist(e.touches[0], e.touches[1]) || 1;
      pz0 = zoom;
      const r = vp.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX)/2 - r.left;
      const my = (e.touches[0].clientY + e.touches[1].clientY)/2 - r.top;
      pcx = (vp.scrollLeft + mx)/zoom; pcy = (vp.scrollTop + my)/zoom;
    }
  }, { passive:true });
  vp.addEventListener('touchmove', e => {
    if(mode === 'pan' && e.touches.length === 1){
      e.preventDefault();
      vp.scrollLeft = tsl - (e.touches[0].clientX - tsx);
      vp.scrollTop  = tst - (e.touches[0].clientY - tsy);
    } else if(mode === 'pinch' && e.touches.length === 2){
      e.preventDefault();
      zoom = Math.max(fitZoom*0.9, Math.min(6, pz0 * (dist(e.touches[0], e.touches[1]) / pd0)));
      applyZoom();
      const r = vp.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX)/2 - r.left;
      const my = (e.touches[0].clientY + e.touches[1].clientY)/2 - r.top;
      vp.scrollLeft = pcx*zoom - mx;
      vp.scrollTop  = pcy*zoom - my;
    }
  }, { passive:false });
  vp.addEventListener('touchend', e => { mode = e.touches.length === 1 ? 'pan' : null; }, { passive:true });

  if(window.ResizeObserver){ new ResizeObserver(() => { if(layout) fitZoom = Math.max(0.02, (vp.clientWidth - 24) / layout.width); }).observe(vp); }
  window.addEventListener('resize', () => {
    if(!layout) return;
    fitZoom = Math.max(0.02, (vp.clientWidth - 24) / layout.width);
  });

  loadData();
})();
</script>
</body>
</html>
